server {
    listen 80;
    server_name perfostand.com www.perfostand.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name perfostand.com www.perfostand.com;

    # SSL — выдаётся через: certbot --nginx -d perfostand.com -d www.perfostand.com
    ssl_certificate     /etc/letsencrypt/live/perfostand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perfostand.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/perfostand.com/frontend-next/out;
    index index.html;

    # Next.js static export — пробуем файл, затем .html, затем директорию
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Иммутабельный кэш для хешированных ассетов Next
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Кэш для статических ассетов (js, css, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Next генерит 404.html из not-found.jsx
    error_page 404 /404.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}

# ---------------------------------------------------------------------------
# Админка: admin.perfostand.com → статика admin-frontend + /api прокси на бек
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.perfostand.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.perfostand.com;

    # SSL — выдаётся через: certbot --nginx -d admin.perfostand.com
    ssl_certificate     /etc/letsencrypt/live/admin.perfostand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.perfostand.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/perfostand.com/admin-frontend/dist;
    index index.html;

    # API бекенда (порт 8300). Слеш в конце proxy_pass срезает префикс /api,
    # совпадая с dev-proxy (rewrite ^/api → '').
    location /api/ {
        proxy_pass http://127.0.0.1:8300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — все маршруты ведут на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
